# Fail2Ban filtresi — Kanıt Paneli web girişleri (journald, kanit-web.service).
# Kurulum: deploy/setup-fail2ban.sh  (hedef: /etc/fail2ban/filter.d/kanit-web.conf)
#
# Uygulama (app/panel.py) başarısız girişleri stderr'e şu biçimde yazar; systemd bunları journald'a
# SyslogIdentifier=kanit-web ile aktarır:
#   kanit-web GIRIS_HATA ip=<ip> kullanici=<ad>     yanlış parola / bilinmeyen kullanıcı
#   kanit-web GIRIS_SINIR ip=<ip>                   IP başına deneme sınırı aşıldı (429)
#   kanit-web GIRIS_KILIT ip=<ip> kullanici=<ad>    kilitli hesaba deneme
# Flask satır başına kendi önekini ekleyebilir ("WARNING:app.panel:" ya da "[zaman] WARNING in panel:");
# bu yüzden desen satır içinde arar.
#
# Deneme: fail2ban-regex "Nov 23 19:00:00 sunucu kanit-web[1234]: kanit-web GIRIS_HATA ip=203.0.113.5 kullanici=admin" /etc/fail2ban/filter.d/kanit-web.conf

[Definition]
# journald arka ucu satırın başına "zaman sunucu kanit-web[pid]: " öneki ekler; desen bağımsızdır (common.conf gerekmez).
failregex = ^.*?\bkanit-web GIRIS_(?:HATA|SINIR|KILIT) ip=<HOST>(?:\s|$)
ignoreregex =
journalmatch = _SYSTEMD_UNIT=kanit-web.service
