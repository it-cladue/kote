# Fail2Ban jail — Kanıt Paneli web girişleri. Kurulum: deploy/setup-fail2ban.sh
# Hedef: /etc/fail2ban/jail.d/kanit-web.local (Plesk'in mevcut fail2ban'ına eklenir; sshd/plesk jail'lerine dokunulmaz).
#
# 10 hatalı giriş / 10 dakika -> 1 saat engel; portlar: 18443 (IP yolu) ve 443 (alan adı).
# UYARI: Cloudflare (turuncu bulut) arkasında bu engel ETKİSİZDİR — TCP bağlantısı Cloudflare uçlarından gelir,
# günlükteki ip= gerçek ziyaretçidir ve iptables onu göremez. Orada asıl koruma uygulamanın hesap kilidi +
# nginx limit_req (gerçek IP) katmanıdır. Cloudflare uç aralıkları ignoreip'tedir; real_ip ayarı bozulsa bile
# Cloudflare hiçbir zaman engellenmez.
[kanit-web]
enabled = true
backend = systemd
filter = kanit-web
port = 18443,443
maxretry = 10
findtime = 10m
bantime = 1h
ignoreip = 127.0.0.1/8 ::1 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
